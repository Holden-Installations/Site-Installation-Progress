      /* ---------- editing ---------- */
      // Read the board hierarchy (needed to save roll-ups) only once someone
      // starts editing, instead of on a timer for every open widget.
      // warmSaveHierarchy reuses a recent or in-flight read, so repeated
      // edits don't add calls.
      function warmForEdit(id) {
        var t = S.allTasks && S.allTasks[id];
        if (!t || S.saving) return;

          console.warn("[My Week] Hierarchy pre-load failed:", error);

      /* ---------- saving ---------- */
      function weightedRollup(parent, values, allTasks) {
        var num = 0,
          den = 0,
          sum = 0,
          cnt = 0;
        parent.children.forEach(function (id) {
          var t = allTasks[id];
          var v = values[id] || 0;
          var dates = datesOf(t);
          var w = dates ? workdays(dates[0], dates[1], t.board.cal) : 0;
          num += v * w;
          den += w;
          sum += v;
          cnt++;
        });
        if (den) return Math.round(num / den);
        return cnt ? Math.round(sum / cnt) : 0;
      }

      function save() {
        if (S.saving) return Promise.resolve();
        var mine = {},
          notes = {};
        progressIds().forEach(function (id) {
          mine[id] = S.edits[id];
        });
        noteIds().forEach(function (id) {
          if (S.allTasks[id] && S.allTasks[id].board.cols.comments)
            notes[id] = S.notes[id];
        });
        var progIds = Object.keys(mine),
          ids = dirtyIds();
        if (!ids.length) return Promise.resolve();
        S.saving = true;
        S.saveError = null;
        S.toast = null;
        paintBottom();
        live("Saving to monday\u2026");
        var saveStarted = performance.now(),
          readDone = 0;

        // Reload every affected installation branch, including all siblings.
        return loadSaveItems(ids, Object.keys(notes))
          .catch(function (error) {
            console.warn(
              "[My Week] Fast save retrieval failed. Using full programme:",
              error,
            );

            step(
              "Fast save retrieval incomplete. Loading full programme for safe saving…",
            );

            return loadAllItems();
          })
          .then(function (items) {
            readDone = performance.now();
            // Index the complete affected branches (every sibling, not just
            // this user's tasks) for the roll-up. The on-screen model is left
            // alone, so the list doesn't change while saving.
            var idx = buildIndex(items, false);
            var fresh = idx.items;
            ids.forEach(function (id) {
              if (!idx.allTasks[id])
                throw new Error(
                  "\u201c" +
                    ((S.allTasks[id] && S.allTasks[id].name) || id) +
                    "\u201d is no longer under an Install row on the board. Refresh and try again.",
                );
            });
            var values = {},
              affected = {};
            Object.keys(idx.allTasks).forEach(function (id) {
              var it = fresh[id];
              values[id] = it
                ? clamp(readNumber(it, "actual") || 0)
                : S.saved[id];
            });
            // Values as they are on the board now, before this save
            var boardValues = Object.assign({}, values);
            progIds.forEach(function (id) {
              values[id] = mine[id];
              idx.allTasks[id].rollupIds.forEach(function (pid) {
                affected[pid] = 1;
              });
            });

            var writes = [],
              lines = [],
              newComments = {};
            ids.forEach(function (id) {
              var bc = idx.allTasks[id].board,
                vals = {};
              if (mine[id] !== undefined) {
                vals[bc.cols.actual.id] = String(mine[id]);
                var st = statusFor(mine[id]);
                if (bc.cols.status && labelOk(bc, st))
                  vals[bc.cols.status.id] = { label: st };
              }
              if (notes[id] !== undefined) {
                // add to what's in the column right now (just reloaded), so other people's comments are kept
                var before = fresh[id]
                  ? readText(fresh[id], "comments").replace(/\s+$/, "")
                  : "";
                var after = (before ? before + "\n" : "") + noteLine(notes[id]);
                if (after.length > CONFIG.commentColumnLimit)
                  throw new Error(
                    "\u201c" +
                      idx.allTasks[id].name +
                      "\u201d already has a full week of comments (" +
                      before.length +
                      " of " +
                      CONFIG.commentColumnLimit +
                      " characters). Shorten your comment, or add it to the task\u2019s Updates in monday.",
                  );
                vals[bc.cols.comments.id] = { text: after };
                newComments[id] = after;
              }
              if (Object.keys(vals).length)
                writes.push({ board: bc.id, item: id, vals: vals });
            });
            Object.keys(affected).forEach(function (pid) {
              var p = idx.parents[pid];
              if (!p) return;
              var bc = p.board,
                v = weightedRollup(p, values, idx.allTasks);
              var before = fresh[pid] ? readNumber(fresh[pid], "actual") : null;
              if (rollupOff(bc, "actual")) {
                var vals = {};
                vals[bc.cols.actual.id] = String(v);
                var st = statusFor(v),
                  stWritten = !!(
                    bc.cols.status &&
                    rollupOff(bc, "status") &&
                    labelOk(bc, st)
                  );
                if (stWritten) vals[bc.cols.status.id] = { label: st };
                writes.push({ board: bc.id, item: pid, vals: vals });
                var change =
                  before == null
                    ? "was blank"
                    : Math.round(before) === v
                      ? "unchanged"
                      : (v > before ? "up from " : "down from ") +
                        Math.round(before) +
                        "%";
                lines.push({
                  path: p.path,
                  value: "now " + v + "%",
                  change:
                    change + (stWritten ? " \u00b7 Status \u2192 " + st : ""),
                });
              } else {
                lines.push({
                  path: p.path,
                  value: "not updated",
                  change: "turn off rollup on " + bc.cols.actual.title,
                });
              }
            });

            // Send in batches; each batch is one request with several mutations
            var batches = [];
            for (var i = 0; i < writes.length; i += 20)
              batches.push(writes.slice(i, i + 20));
            return batches
              .reduce(function (p, batch) {
                return p.then(function () {
                  var defs = [],
                    body = [],
                    vars = {};
                  batch.forEach(function (w, k) {
                    defs.push(
                      "$b" + k + ": ID!",
                      "$i" + k + ": ID!",
                      "$v" + k + ": JSON!",
                    );
                    body.push(
                      "m" +
                        k +
                        ": change_multiple_column_values(board_id: $b" +
                        k +
                        ", item_id: $i" +
                        k +
                        ", column_values: $v" +
                        k +
                        ") { id }",
                    );
                    vars["b" + k] = String(w.board);
                    vars["i" + k] = String(w.item);
                    vars["v" + k] = JSON.stringify(w.vals);
                  });
                  return api(
                    "mutation (" +
                      defs.join(", ") +
                      ") { " +
                      body.join(" ") +
                      " }",
                    vars,
                  );
                });
              }, Promise.resolve())
              .then(function () {
                return {
                  lines: lines,
                  boardValues: boardValues,
                  newComments: newComments,
                  writeCount: writes.length,
                  requestCount: batches.length,
                };
              });
          })
          .then(function (result) {
            var lines = result.lines;
            var now = performance.now();
            step(
              "Saved in " +
                ((now - saveStarted) / 1000).toFixed(2) +
                "s (read " +
                ((readDone - saveStarted) / 1000).toFixed(2) +
                "s, wrote " +
                result.writeCount +
                " rows in " +
                result.requestCount +
                " request" +
                (result.requestCount === 1 ? "" : "s") +
                ", " +
                ((now - readDone) / 1000).toFixed(2) +
                "s)",
            );
            // Everything written is known, so update the screen locally rather
            // than reloading every assigned task from monday.
            // Pick up current board values for this user's other tasks in the
            // saved branches (someone else may have changed them).
            Object.keys(result.boardValues).forEach(function (id) {
              if (S.allTasks[id] && mine[id] === undefined) {
                S.saved[id] = result.boardValues[id];
                S.allTasks[id].actual = result.boardValues[id];
              }
            });
            progIds.forEach(function (id) {
              S.saved[id] = mine[id];
              if (S.allTasks[id]) S.allTasks[id].actual = mine[id];
              if (S.edits[id] === mine[id]) delete S.edits[id];
            });
            Object.keys(result.newComments).forEach(function (id) {
              if (S.allTasks[id])
                S.allTasks[id].comments = result.newComments[id];
            });
            Object.keys(notes).forEach(function (id) {
              if (S.notes[id] === notes[id]) {
                delete S.notes[id];
                delete S.noteOpen[id];
              }
            });
            S.saving = false;
            var n = ids.length,
              c = Object.keys(notes).length;
            var title =
              "Saved " +
              n +
              " task" +
              (n === 1 ? "" : "s") +
              (c ? " (" + c + " comment" + (c === 1 ? "" : "s") + ")" : "") +
              " to monday";
            render();
            showToast({ title: title, lines: lines }, 9000);
            live(
              title +
                ". " +
                lines
                  .map(function (l) {
                    return l.path + " " + l.value;
                  })
                  .join(". "),
            );
          })
          .catch(function (err) {
            S.saving = false;
            S.saveError = (err && err.message) || "Unknown error";
            paintBottom();
            live("Couldn\u2019t save to monday. Your changes are kept.");
          });
      }

      function refresh(keepEdits) {
        S.toast = null;
        return load()
          .then(function () {
            if (!keepEdits) clearDrafts();
            render();
            showToast({ title: "Up to date with monday" }, 2500);
          })
          .catch(function (err) {
            showToast(
              {
                title: "Couldn\u2019t refresh",
                detail: (err && err.message) || "",
              },
              6000,
            );
          });
      }

      function showDiary() {
        var old = $("#diaryview");
        if (old) old.remove();
        var rows = diaryRead(),
          out = [],
          last = null;
        rows.forEach(function (r) {
          if (r.s !== last) {
            out.push("");
            out.push(
              "=== " +
                new Date(r.at).toLocaleString() +
                (r.s === diarySession ? "  (this load)" : ""),
            );
            last = r.s;
          }
          out.push(
            ("+" + (r.ms / 1000).toFixed(1) + "s").padStart(7) + "  " + r.ev,
          );
        });
        var text = "App version " + window.APP_VERSION + "\n" + out.join("\n");
        var box = document.createElement("div");
        box.id = "diaryview";
        box.className = "overlay";
        box.innerHTML =
          '<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dg-t" style="max-width:720px">' +
          '<h2 id="dg-t">Load diary (this device)</h2><p>Each block is one time the app was opened. A block that never reaches READY is a failed load.</p>' +
          '<textarea id="diarytext" readonly style="width:100%;height:50vh;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--border);border-radius:4px;padding:8px;background:var(--page);color:var(--text)"></textarea>' +
          '<div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn primary" data-act="diarycopy">Copy</button><button type="button" class="btn" data-act="diaryclear">Clear diary</button><button type="button" class="btn" data-act="diaryclose">Close</button></div></div>';
        document.body.appendChild(box);
        $("#diarytext").value = text;
      }

      function toggleTaskCard(card) {
        var id = card.getAttribute("data-id");
        var expanded = !card.classList.contains("expanded");
        card.classList.toggle("expanded", expanded);
        S.expanded[id] = expanded;
        card.setAttribute("aria-expanded", String(expanded));
      }

      /* ---------- events ---------- */
      document.addEventListener("click", function (e) {
        var card = e.target.closest("article.task");
        var b = e.target.closest("[data-act]");
        // Controls must never trigger expand/collapse, including slider dragging,
        // comment editing and plus/minus buttons.
        if (card && !b) {
          if (
            !e.target.closest(
              "button, input, textarea, select, a, label, .bar, [contenteditable]",
            )
          ) {
            toggleTaskCard(card);
          }
          return;
        }
        if (!b || b.disabled) return;
        var act = b.getAttribute("data-act");
        var id = card && card.getAttribute("data-id");
        if (act === "dec") setActual(id, actualOf(id) - 1);
        else if (act === "inc") setActual(id, actualOf(id) + 1);
        else if (act === "save") save();
        else if (act === "clearsearch") {
          S.search = "";
          render();
          var sf = document.getElementById("task-search");
          if (sf) sf.focus();
        } else if (act === "addnote") {
          S.noteOpen[id] = true;
          S.expanded[id] = true;
          card.classList.add("noteopen", "expanded");
          card.setAttribute("aria-expanded", "true");
          var ta = card.querySelector("textarea.note");
          if (ta) ta.focus();
        } else if (act === "removenote") {
          delete S.notes[id];
          delete S.noteOpen[id];
          var tb2 = card.querySelector("textarea.note");
          if (tb2) tb2.value = "";
          card.classList.remove("noteopen");
          noteChanged(id, card);
          var ab = card.querySelector('[data-act="addnote"]');
          if (ab) ab.focus();
        } else if (act === "diarytap") {
          var now = Date.now();
          S.taps = (S.taps || []).filter(function (t) {
            return now - t < 3000;
          });
          S.taps.push(now);
          if (S.taps.length >= 5) {
            S.taps = [];
            showDiary();
          }
        } else if (act === "diaryclose") {
          $("#diaryview").remove();
        } else if (act === "diaryclear") {
          diaryClear();
          $("#diaryview").remove();
          live("Load diary cleared");
        } else if (act === "diarycopy") {
          var tx = $("#diarytext");
          tx.select();
          try {
            document.execCommand("copy");
            live("Copied");
          } catch (e) {}
        } else if (act === "tab") {
          S.tab = b.getAttribute("data-tab");
          S.tabPicked = true;
          S.focusTab = !!b.closest("[role=tablist]");
          render();
        } else if (act === "discard") {
          clearDrafts();
          S.saveError = null;
          render();
          live("Changes discarded");
        } else if (act === "closetoast") {
          clearTimeout(toastTimer);
          S.toast = null;
          paintBottom();
        } else if (act === "refresh") {
          if (dirtyIds().length) {
            S.dialog = true;
            paintDialog();
          } else refresh();
        } else if (act === "closedialog") {
          S.dialog = false;
          paintDialog();
        } else if (act === "discardrefresh") {
          S.dialog = false;
          clearDrafts();
          refresh();
        } else if (act === "saverefresh") {
          S.dialog = false;
          paintDialog();
          save().then(function () {
            if (!S.saveError) refresh(true);
          });
        }
      });
      document.addEventListener("input", function (e) {
        if (e.target.matches("#task-search")) {
          S.search = e.target.value;
          // Re-render filtered tabs and cards without discarding unsaved edits.
          var pos = e.target.selectionStart;
          render();
          var replacement = document.getElementById("task-search");
          if (replacement) {
            replacement.focus();
            try {
              replacement.setSelectionRange(pos, pos);
            } catch (_) {}
          }
          return;
        }
        if (e.target.matches("textarea.note")) {
          var card = e.target.closest("article.task"),
            id = card.getAttribute("data-id");
          S.notes[id] = e.target.value;
          noteChanged(id, card);
          return;
        }
        if (!e.target.matches("input.range")) return;
        setActual(
          e.target.closest("article.task").getAttribute("data-id"),
          e.target.value,
        );
      });
      document.addEventListener("focusin", function (e) {
        if (e.target.matches("input.range"))
          e.target.closest("article.task").classList.add("focus");
      });
      document.addEventListener("focusout", function (e) {
        if (e.target.matches("input.range"))
          e.target.closest("article.task").classList.remove("focus");
      });
      document.addEventListener("keydown", function (e) {
        if (
          e.target.matches("article.task") &&
          (e.key === "Enter" || e.key === " ")
        ) {
          e.preventDefault();
          toggleTaskCard(e.target);
          return;
        }
        if (e.key === "Escape" && S.dialog) {
          S.dialog = false;
          paintDialog();
        }
        if (
          (e.key === "ArrowRight" || e.key === "ArrowLeft") &&
          e.target.matches("[role=tab]")
        ) {
          var order = ["carried", "week", "upcoming"];
          var at = order.indexOf(S.tab);
          S.tab =
            order[
              (at + (e.key === "ArrowRight" ? 1 : order.length - 1)) %
                order.length
            ];
          S.tabPicked = true;
          S.focusTab = true;
          render();
          e.preventDefault();
        }
      });
      window.addEventListener("beforeunload", function (e) {
        if (dirtyIds().length) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      /* ---------- start ---------- */
      function problemBox(title, body) {
        return (
          '<main><div class="wrap"><div class="problem"><p class="h">' +
          title +
          "</p>" +
          body +
          "</div></div></main>"
        );
      }
      function showFatal(err) {
        window.__appReady = true;
        step(
          "Stopped: " +
            ((err &&
              (err.message ||
                (err.setup && "board setup") ||
                (err.noBoards && "no boards connected"))) ||
              err),
        );
        if (!(err && (err.setup || err.noBoards)))
          showDiag("Stopped with a problem.");
        if (err && err.setup) {
          S.fatal =
            headerHTML() +
            problemBox(
              S.boards.length > 1
                ? "None of these boards are set up for My week yet"
                : "This board isn\u2019t set up for My week yet",
              "<ul>" +
                S.boards
                  .map(function (b) {
                    return b.problems
                      .map(function (p) {
                        return (
                          "<li>" +
                          (S.boards.length > 1 ? esc(b.name) + ": " : "") +
                          esc(p) +
                          "</li>"
                        );
                      })
                      .join("");
                  })
                  .join("") +
                "</ul>" +
                '<p class="s">Add or rename the column on the board, or update the column list at the top of the app\u2019s code.</p>' +
                setupHTML(),
            );
        } else if (err && err.noBoards) {
          S.fatal = problemBox(
            "Connect your project boards",
            '<p class="s">Open this widget\u2019s settings and choose the project boards to show tasks from. Pick every project you work on and your tasks from all of them appear together.</p>',
          );
        } else if (
          err &&
          err.message === "NO_MONDAY" &&
          window.top !== window
        ) {
          var reloaded = false;
          try {
            reloaded = sessionStorage.getItem("myweek_reloaded") === "1";
          } catch (e) {}
          if (!reloaded) {
            try {
              sessionStorage.setItem("myweek_reloaded", "1");
            } catch (e) {}
            diary("no answer from monday after 20s, reloading once");
            location.reload();
            return;
          }
          S.fatal = problemBox(
            "Can\u2019t reach monday",
            '<p class="s">The app loaded, but monday didn\u2019t answer. Close this dashboard and open it again.</p><button type="button" class="btn primary" onclick="try{sessionStorage.removeItem(\'myweek_reloaded\')}catch(e){};location.reload()" style="margin-top:8px">Try again</button>',
          );
        } else if (err && err.message === "NO_MONDAY") {
          S.fatal = problemBox(
            "Open this inside monday",
            '<p class="s">My week runs inside monday as a board view or a dashboard widget.</p>',
          );
        } else {
          S.fatal = problemBox(
            "Couldn\u2019t load your tasks",
            '<p class="s">' +
              esc((err && err.message) || err) +
              '</p><p class="s">Check your connection, then reload.</p>',
          );
        }
        render();
      }

      function idsFromContext(ctx) {
        var ids =
          ctx.boardIds && ctx.boardIds.length
            ? ctx.boardIds
            : ctx.boardId
              ? [ctx.boardId]
              : [];
        return ids.map(String).filter(function (v, i, a) {
          return v && a.indexOf(v) === i;
        });
      }
      function start() {
        S.fatal = null;
        S.loaded = false;
        render();
        return load()
          .then(function () {
            S.loaded = true;
            S.fatal = null;
            if (!S.tabPicked)
              S.tab = visibleViews().carried.length ? "carried" : "week";
            render();
            window.__appReady = true;
            document.getElementById("diag").style.display = "none";
            try {
              sessionStorage.removeItem("myweek_reloaded");
            } catch (e) {}
            diary("READY · " + S.tasks.length + " tasks");
            // Read the board structure once, shortly after the list is shown, so a
            // save doesn't have to wait for it. It's kept for 10 minutes and
            // re-read on the next edit after that (see warmForEdit). No timer.
            setTimeout(function () {
              okBoards().forEach(function (bc) {
                warmSaveHierarchy(bc).catch(function (error) {
                  console.warn("[My Week] Hierarchy pre-load failed:", error);
                });
              });
            }, 1000);
          })
          .catch(showFatal);
      }

      function applyTheme(t) {
        document.documentElement.setAttribute(
          "data-theme",
          t === "dark" || t === "black" ? t : "light",
        );
      }
      getContext()
        .then(function (ctx) {
          applyTheme(ctx.theme);
          step(
            "Connected (" +
              (ctx.instanceType || "unknown view") +
              ", boards: " +
              JSON.stringify(ctx.boardIds || ctx.boardId || []) +
              "). Reading your profile…",
          );
          S.instanceType = ctx.instanceType || null;
          S.boardIds = idsFromContext(ctx);
          return api("query { me { id name photo_thumb_small } }");
        })
        .then(function (data) {
          if (!data || !data.me)
            throw new Error("monday didn\u2019t return your profile.");
          S.me = data.me;
          step(
            "Signed in as " + (data.me && data.me.name) + ". Loading boards…",
          );
          // Widget users can change which boards are connected; reload when they do
          try {
            monday.listen("context", function (res) {
              if (res && res.data && res.data.theme) applyTheme(res.data.theme);
              var next = idsFromContext((res && res.data) || {});
              if (
                next.join(",") !== S.boardIds.join(",") &&
                !dirtyIds().length
              ) {
                S.boardIds = next;
                start();
              }
            });
          } catch (e) {
            /* context updates are optional */
          }
          return start();
        })
        .catch(showFatal);
    </script>
  </body>
</html>
