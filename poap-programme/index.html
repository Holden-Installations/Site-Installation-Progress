    </style>
  </head>
  <body>
    <div id="app">
      <div class="loading">Loading the marked-up programme…</div>
    </div>
    <script>
      // ---- Programme working calendar (identical code in the Programme Planner, My week and the weekly snapshot) ----
      // The project board's description carries one line, written by the planner's import (or typed by hand):
      //   Working calendar (from MS Project): Mon–Sat · non-working 21 Dec 2026 – 3 Jan 2027; 6 Apr 2027 · working 28 Dec 2026
      // With it, working days follow the programme's MS Project calendar; without it every tool counts Monday–Friday.
      const CAL_DAY = 86400000;
      const CAL_MON = [
        "jan",
        "feb",
        "mar",
        "apr",
        "may",
        "jun",
        "jul",
        "aug",
        "sep",
        "oct",
        "nov",
        "dec",
      ];
      const CAL_WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      function calDayNum(y, m, d) {
        return Math.round(Date.UTC(y, m, d) / CAL_DAY);
      } // whole days since 1 Jan 1970
      function calWeekday(dn) {
        return ((dn % 7) + 7 + 4) % 7;
      } // 1 Jan 1970 was a Thursday
      function calParseDate(s) {
        s = String(s || "").trim();
        let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return calDayNum(+m[1], +m[2] - 1, +m[3]);
        m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?\s+'?(\d{2,4})$/);
        if (!m) return null;
        const mo = CAL_MON.indexOf(m[2].toLowerCase());
        if (mo < 0) return null;
        let y = +m[3];
        if (y < 100) y += 2000;
        return calDayNum(y, mo, +m[1]);
      }
      function calParseRanges(s) {
        const out = [];
        String(s || "")
          .split(/[;,]/)
          .forEach((piece) => {
            const ends = piece.trim().split(/\s+(?:[–—-]|to)\s+/i);
            const a = calParseDate(ends[0]),
              b = ends.length > 1 ? calParseDate(ends[1]) : a;
            if (a != null && b != null)
              out.push([Math.min(a, b), Math.max(a, b)]);
          });
        return out;
      }
      function makeWorkingCalendar(days, off, on) {
        const START = calDayNum(2015, 0, 1),
          END = calDayNum(2045, 11, 31);
        const work = new Uint8Array(END - START + 1);
        for (let dn = START; dn <= END; dn++)
          work[dn - START] = days[calWeekday(dn)] ? 1 : 0;
        const mark = (ranges, v) =>
          ranges.forEach(([a, b]) => {
            for (let dn = Math.max(a, START); dn <= Math.min(b, END); dn++)
              work[dn - START] = v;
          });
        mark(off, 0);
        mark(on, 1); // extra working days win
        const cum = new Int32Array(work.length + 1);
        for (let i = 0; i < work.length; i++) cum[i + 1] = cum[i] + work[i];
        const isWork = (dn) =>
          dn < START || dn > END
            ? !!days[calWeekday(dn)]
            : work[dn - START] === 1;
        return {
          days,
          off,
          on,
          isWork,
          count(a, b) {
            // working days from a to b, both included
            if (b < a) return 0;
            if (a >= START && b <= END)
              return cum[b - START + 1] - cum[a - START];
            let n = 0;
            for (let dn = a; dn <= b; dn++) if (isWork(dn)) n++;
            return n;
          },
        };
      }
      function parseWorkingCalendar(text) {
        const lines = String(text || "").split(/\r?\n/);
        const at = lines.findIndex((l) =>
          /working calendar\s*\(from ms project\)\s*:/i.test(l),
        );
        if (at < 0) return null;
        // the line may have been broken by hand: follow it while it clearly continues
        let body = lines[at].replace(
          /^.*?working calendar\s*\(from ms project\)\s*:\s*/i,
          "",
        );
        for (let k = at + 1; k < lines.length; k++) {
          const next = lines[k].trim();
          if (!next) break;
          if (
            /[-–—·•|;,]\s*$/.test(body) ||
            /^(non|working|\d|[·•|;,])/i.test(next)
          )
            body += " " + next;
          else break;
        }
        const parts = body.split(/\s*[·•|]\s*/);
        const DAYS = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
        const days = [false, false, false, false, false, false, false];
        const dp = (parts.shift() || "").toLowerCase();
        const rng = dp.match(
          /^(sun|mon|tue|wed|thu|fri|sat)[a-z]*\s*[–—-]\s*(sun|mon|tue|wed|thu|fri|sat)/,
        );
        if (rng) {
          for (let i = DAYS[rng[1]], g = 0; g < 7; i = (i + 1) % 7, g++) {
            days[i] = true;
            if (i === DAYS[rng[2]]) break;
          }
        } else
          (dp.match(/sun|mon|tue|wed|thu|fri|sat/g) || []).forEach((k) => {
            days[DAYS[k]] = true;
          });
        if (!days.some(Boolean)) return null;
        const off = [],
          on = [];
        parts.forEach((p) => {
          const mm = p.match(/^(non[\s-]*working|working)\s+(.*)$/i);
          if (!mm) return;
          (/^non/i.test(mm[1]) ? off : on).push(...calParseRanges(mm[2]));
        });
        return makeWorkingCalendar(days, off, on);
      }
      function calFmtDate(dn) {
        const d = new Date(dn * CAL_DAY);
        return (
          d.getUTCDate() +
          " " +
          CAL_MON[d.getUTCMonth()][0].toUpperCase() +
          CAL_MON[d.getUTCMonth()].slice(1) +
          " " +
          d.getUTCFullYear()
        );
      }
      function formatWorkingCalendar(days, off, on) {
        const order = [1, 2, 3, 4, 5, 6, 0],
          idx = order.filter((i) => days[i]);
        const first = order.indexOf(idx[0]),
          last = order.indexOf(idx[idx.length - 1]);
        const contiguous = idx.length > 1 && last - first + 1 === idx.length;
        const dayText = contiguous
          ? `${CAL_WD[idx[0]]}–${CAL_WD[idx[idx.length - 1]]}`
          : idx.map((i) => CAL_WD[i]).join(", ");
        const merge = (rs) =>
          rs
            .slice()
            .sort((a, b) => a[0] - b[0])
            .reduce((acc, r) => {
              const l = acc[acc.length - 1];
              if (l && r[0] <= l[1] + 1) l[1] = Math.max(l[1], r[1]);
              else acc.push(r.slice());
              return acc;
            }, []);
        const fmt = (rs) =>
          merge(rs)
            .map(([a, b]) =>
              a === b ? calFmtDate(a) : `${calFmtDate(a)} – ${calFmtDate(b)}`,
            )
            .join("; ");
        let line = `Working calendar (from MS Project): ${dayText}`;
        if (off.length) line += ` · non-working ${fmt(off)}`;
        if (on.length) line += ` · working ${fmt(on)}`;
        return line;
      }
      // ---- end of shared calendar code ----

      // POAP reads current values directly from each project board.
      var PROJECT_COLS = {
        actual: { id: "numeric_mm85vp3d", title: "actual %" },
        timeline: { id: "", title: "timeline" },
        index: { id: "", title: "index" },
        // Latest Baseline: filled by the planner's import. monday's "Baseline of Timeline (…)" columns are no longer used.
        baseline: {
          id: "5103953529__timerange_mm8b45mv",
          title: "latest baseline",
        },
      };
      // tracked tasks: the lowest rows (nothing under them) with an Install / Installation / Installations row anywhere above
      var TRACKED_PARENT = /^install(ation)?s?$/;
      function installChain(it, byId, hasKids) {
        // the rows above a tracked task, nearest first; null if it isn't one
        if (hasKids[it.id]) return null;
        var chain = [],
          cur = it.parent_item && byId[it.parent_item.id],
          g = 0;
        while (cur && g++ < 12) {
          chain.push(cur);
          cur = cur.parent_item && byId[cur.parent_item.id];
        }
        var top = -1;
        chain.forEach(function (a, k) {
          if (TRACKED_PARENT.test(norm(a.name))) top = k;
        });
        return top < 0 ? null : { chain: chain, top: top };
      }

      var monday = window.mondaySdk();
      function norm(s) {
        return String(s || "")
          .toLowerCase()
          .replace(/\s+/g, " ")
          .trim();
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      function api(query, variables) {
        return monday
          .api(query, { variables: variables || {} })
          .then(function (res) {
            if (!res) throw new Error("monday sent back an empty reply.");
            if (res.errors && res.errors.length)
              throw new Error(
                res.errors
                  .map(function (e) {
                    return e.message;
                  })
                  .join("; "),
              );
            if (res.error_message) throw new Error(res.error_message);
            return res.data;
          });
      }
      function applyTheme(t) {
        document.documentElement.setAttribute(
          "data-theme",
          t === "dark" || t === "black" ? t : "light",
        );
      }
      function idsFromContext(ctx) {
        var ids =
          ctx.boardIds && ctx.boardIds.length
            ? ctx.boardIds
            : ctx.boardId
              ? [ctx.boardId]
              : [];
        return ids.map(String).filter(function (v, i, a) {
          return v && a.indexOf(v) === i;
        });
      }
      function getContext() {
        return new Promise(function (resolve, reject) {
          var done = false,
            tries = 0;
          function attempt() {
            if (done) return;
            tries++;
            monday.get("context").then(
              function (r) {
                var c = r && r.data;
                if (
                  !done &&
                  c &&
                  (c.instanceType ||
                    c.boardId ||
                    (c.boardIds && c.boardIds.length))
                ) {
                  done = true;
                  clearInterval(timer);
                  resolve(c);
                }
              },
              function () {},
            );
          }
          var timer = setInterval(function () {
            if (tries >= 10) {
              clearInterval(timer);
              if (!done) {
                done = true;
                reject(new Error("NO_MONDAY"));
              }
              return;
            }
            attempt();
          }, 2000);
          attempt();
        });
      }
      // ---- dates as whole days (UTC day numbers) ----
      function dnOf(iso) {
        if (!iso) return null;
        var p = String(iso).slice(0, 10).split("-").map(Number);
        return p.length === 3 && p[0] ? calDayNum(p[0], p[1] - 1, p[2]) : null;
      }
      function dnToday() {
        if (window.TEST_TODAY) return dnOf(window.TEST_TODAY);
        var n = new Date();
        return calDayNum(n.getFullYear(), n.getMonth(), n.getDate());
      }
      function fmtDn(dn, withDay) {
        var d = new Date(dn * CAL_DAY);
        return (
          (withDay === false ? "" : CAL_WD[d.getUTCDay()] + " ") +
          d.getUTCDate() +
          " " +
          CAL_MON[d.getUTCMonth()][0].toUpperCase() +
          CAL_MON[d.getUTCMonth()].slice(1, 3)
        );
      }
      function fmtWhen(dt) {
        return (
          dt.toLocaleDateString("en-GB", {
            weekday: "short",
            day: "numeric",
            month: "short",
          }) +
          " " +
          dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })
        );
      }
      function makeIsWork(cal) {
        return function (dn) {
          if (cal) return cal.isWork(dn);
          var w = calWeekday(dn);
          return w >= 1 && w <= 5;
        };
      }
      function makeCount(cal) {
        return function (a, b) {
          if (b < a) return 0;
          if (cal) return cal.count(a, b);
          var n = 0;
          for (var d = a; d <= b; d++) {
            var w = calWeekday(d);
            if (w >= 1 && w <= 5) n++;
          }
          return n;
        };
      }
      // ---- the project board: name, calendar line, columns ----
      function readBoard(boardId) {
        return api(
          "query ($b: [ID!]) { boards(ids: $b, hierarchy_types: [classic, multi_level]) { id name description columns { id title type } } }",
          { b: [boardId] },
        )
          .catch(function () {
            return api(
              "query ($b: [ID!]) { boards(ids: $b) { id name description columns { id title type } } }",
              { b: [boardId] },
            );
          })
          .then(function (d) {
            var b = d && d.boards && d.boards[0];
            if (!b) throw new Error("This board could not be read.");
            var find = function (spec) {
              return (
                (spec.id &&
                  b.columns.filter(function (c) {
                    return c.id === spec.id;
                  })[0]) ||
                b.columns.filter(function (c) {
                  return norm(c.title) === spec.title;
                })[0] ||
                null
              );
            };
            return {
              id: String(b.id),
              name: b.name,
              cal: parseWorkingCalendar(b.description),
              cols: {
                actual: find(PROJECT_COLS.actual),
                timeline: find(PROJECT_COLS.timeline),
                index: find(PROJECT_COLS.index),
                baseline: find(PROJECT_COLS.baseline),
              },
            };
          });
      }
      function problemHtml(title, body) {
        return (
          '<div class="problem"><p class="h">' +
          esc(title) +
          '</p><p class="s">' +
          body +
          "</p></div>"
        );
      }

      var DPX = 22,
        ROW = 30,
        GRID_W = [180, 70, 62, 76];
      var RED = "#DF2F4A",
        GREEN = "#037F4C",
        DONE = "#00C875";
      function areaOf(name) {
        var s = String(name || "");
        var i = s.search(/[-–—]/);
        return (i > 0 ? s.slice(0, i) : s).trim();
      }
      function natural(a, b) {
        return String(a).localeCompare(String(b), undefined, {
          numeric: true,
          sensitivity: "base",
        });
      }

      // Two-stage retrieval: paginate lightweight item IDs in board order, then
      // retrieve only the four required columns via independent 100-item batches.
      // Unlike cursor pages, ID batches can run concurrently. On any mismatch
      // or API incompatibility we fall back to the original full-page query.
      function readItems(boardId, colIds) {
        var PAGE_SIZE = 500;
        var BATCH_SIZE = 100; // monday's documented items(ids:) maximum
        var WORKERS = 8;
        var timings = {
          strategy: "parallel-details",
          pageCount: 0,
          batchCount: 0,
        };
        var started = performance.now();
        var minimal = "id name parent_item { id }";
        var full = function (cap) {
          return (
            minimal +
            " column_values(ids: $c" +
            (cap ? ", capabilities: [CALCULATED]" : "") +
            ") { id text value ... on NumbersValue { number } ... on TimelineValue { from to } }"
          );
        };
        function pageFirst(fields, cap) {
          // The lightweight discovery query does not use $c. GraphQL rejects
          // queries declaring unused variables, so include it only for detail pages.
          var usesColumns = fields.indexOf("column_values(") !== -1;
          return api(
            "query ($b: [ID!]" +
              (usesColumns ? ", $c: [String!]" : "") +
              ") { boards(ids: $b) { items_page(limit: " +
              PAGE_SIZE +
              ', hierarchy_scope_config: "allItems") { cursor items { ' +
              fields +
              " } } } }",
            usesColumns ? { b: [boardId], c: colIds } : { b: [boardId] },
          ).then(function (d) {
            if (!d || !d.boards || !d.boards[0] || !d.boards[0].items_page)
              throw new Error("Missing first items page");
            return d.boards[0].items_page;
          });
        }
        function pageNext(cursor, fields) {
          var usesColumns = fields.indexOf("column_values(") !== -1;
          return api(
            "query ($cur: String!" +
              (usesColumns ? ", $c: [String!]" : "") +
              ") { next_items_page(limit: " +
              PAGE_SIZE +
              ", cursor: $cur) { cursor items { " +
              fields +
              " } } }",
            usesColumns ? { cur: cursor, c: colIds } : { cur: cursor },
          ).then(function (d) {
            if (!d || !d.next_items_page)
              throw new Error("Missing next items page");
            return d.next_items_page;
          });
        }
        function enumerate(fields) {
          var rows = [];
          var seenCursors = new Set();
          function accept(page) {
            timings.pageCount++;
            if (!page || !Array.isArray(page.items))
              throw new Error("Invalid item page");
            for (var i = 0; i < page.items.length; i++)
              rows.push(page.items[i]);
            if (!page.cursor) return Promise.resolve(rows);
            if (seenCursors.has(page.cursor))
              throw new Error("Repeated items cursor");
            seenCursors.add(page.cursor);
            return pageNext(page.cursor, fields).then(accept);
          }
          return pageFirst(fields).then(accept);
        }
        function detailBatch(ids, cap) {
          return api(
            "query ($ids: [ID!], $c: [String!]) { items(ids: $ids, limit: 100) { " +
              full(cap) +
              " } }",
            { ids: ids, c: colIds },
          ).then(function (d) {
            if (!d || !Array.isArray(d.items))
              throw new Error("Missing detail items");
            return d.items;
          });
        }
        function readDetails(rows, cap) {
          var batches = [];
          for (var i = 0; i < rows.length; i += BATCH_SIZE)
            batches.push(
              rows.slice(i, i + BATCH_SIZE).map(function (it) {
                return it.id;
              }),
            );
          timings.batchCount = batches.length;
          var results = new Array(batches.length);
          var next = 0;
          var firstError = null;
          function worker() {
            if (firstError || next >= batches.length) return Promise.resolve();
            var index = next++;
            return detailBatch(batches[index], cap).then(
              function (items) {
                results[index] = items;
                return worker();
              },
              function (error) {
                // Drain in-flight requests before retrying or falling back.
                if (!firstError) firstError = error;
              },
            );
          }
          var workers = [];
          for (var j = 0; j < Math.min(WORKERS, batches.length); j++)
            workers.push(worker());
          return Promise.all(workers).then(function () {
            if (firstError) throw firstError;
            var byId = new Map();
            results.forEach(function (batch) {
              batch.forEach(function (it) {
                if (!it || it.id == null || byId.has(String(it.id)))
                  throw new Error("Duplicate or invalid detail item");
                byId.set(String(it.id), it);
              });
            });
            if (byId.size !== rows.length)
              throw new Error("Detail item count mismatch");
            return rows.map(function (base) {
              var it = byId.get(String(base.id));
              if (!it || !Array.isArray(it.column_values))
                throw new Error("Missing detail values for item " + base.id);
              // Preserve the exact original paginated ordering and parent links.
              if (String(it.id) !== String(base.id))
                throw new Error("ID mismatch");
              return {
                id: base.id,
                name: base.name,
                parent_item: base.parent_item,
                column_values: it.column_values,
              };
            });
          });
        }
        function fallback(reason) {
          console.warn(
            "[POAP Programme] Parallel retrieval unavailable; using original pagination:",
            reason,
          );
          timings.strategy = "original-fallback";
          timings.pageCount = 0;
          timings.batchCount = 0;
          function fullScan(cap) {
            return enumerate(full(cap));
          }
          return fullScan(true).catch(function () {
            timings.pageCount = 0;
            return fullScan(false);

              .then(function (items) {

          .then(function (items) {

      function cvOf(it, colId) {

        if (!v) return null;

            if (j) {
              f = j.from;
              t = j.to;

          b = dnOf(t);

      function build(board, items) {

          count = makeCount(board.cal);

        var byId = {},
          hasKids = {};
        items.forEach(function (it) {
          byId[it.id] = it;
          if (it.parent_item) hasKids[it.parent_item.id] = 1;
        });
        var top = function (it) {
          var cur = it,
            g = 0;
          while (cur.parent_item && byId[cur.parent_item.id] && g++ < 10)
            cur = byId[cur.parent_item.id];

        var C = board.cols,

        items.forEach(function (it) {

          var plan = bl || tl;
          if (!plan) return;
          var s = plan[0],
            f = plan[1],

          var actual = Math.max(

      // Read current board values directly; no scheduled snapshot or history board required.
      function loadProject(boardId) {
        var startAt = performance.now();

        return readBoard(boardId).then(function (b) {
          times.boardMs = Math.round(performance.now() - startAt);
          function finish(value) {
            times.totalMs = Math.round(performance.now() - startAt);
            console.info("[POAP Programme] Load metrics", boardId, times);
            return value;
          }
          if (!b.cols.actual || !b.cols.timeline)
            return finish({
              name: b.name,
              html: problemHtml(
                "Board not set up",
                "This board needs the “Timeline” and live “Actual %” columns.",
              ),
            });
          var ids = [
            b.cols.timeline.id,
            b.cols.actual.id,
            b.cols.baseline && b.cols.baseline.id,
            b.cols.index && b.cols.index.id,
          ].filter(Boolean);
          var itemsStarted = performance.now();
          return readItems(boardId, ids).then(function (items) {
            times.itemsMs = Math.round(performance.now() - itemsStarted);
            times.itemCount = items.length;

                : {
                    name: b.name,
                    html: r.html,
                    scrollTo: r.scrollTo,
                    cacheable: true,
                  },

        });

      // Instant repeat-load UX: user-scoped, versioned, short-lived live-view cache.
      // Cached data is always labelled and always refreshed from monday.com.
      var POAP_CACHE_VERSION = "poap-v9-live-1";
      var POAP_CACHE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
      var poapUserScope = "";
      var poapLoadGeneration = 0;
      function poapCacheKey(boardId) {
        return POAP_CACHE_VERSION + ":" + poapUserScope + ":" + String(boardId);
      }
      function poapCacheRead(boardId) {
        if (!poapUserScope) return null;
        try {
          var raw = localStorage.getItem(poapCacheKey(boardId));
          if (!raw) return null;
          var saved = JSON.parse(raw);
          if (
            !saved ||
            !Number.isFinite(saved.savedAt) ||
            Date.now() - saved.savedAt > POAP_CACHE_MAX_AGE_MS ||
            Date.now() < saved.savedAt ||
            typeof saved.html !== "string"

            return null;
          return saved;
        } catch (e) {
          return null;
        } // third-party iframe storage may be blocked
      }
      function poapCacheWrite(boardId, result) {
        if (!poapUserScope || !result || !result.cacheable || !result.html)
          return;
        try {
          localStorage.setItem(
            poapCacheKey(boardId),
            JSON.stringify({
              savedAt: Date.now(),
              name: result.name,
              html: result.html,
              scrollTo: result.scrollTo || 0,
            }),
          );
        } catch (e) {
          /* quota and tracking protection must not break widget */
        }
      }
      function poapCacheNotice(timestamp, refreshing, error) {
        var when = new Date(timestamp).toLocaleString("en-GB", {
          day: "2-digit",
          month: "short",
          hour: "2-digit",
          minute: "2-digit",
        });
        return (
          '<div class="info" role="status" style="padding:5px 9px;background:var(--page);border:1px solid var(--border);border-radius:6px">' +
          (error
            ? "Cached programme · refresh failed · last updated "
            : refreshing
              ? "Cached programme · checking for updates · last updated "
              : "Programme checked · updated ") +
          esc(when) +
          (error ? " · Reload to retry" : "") +
          "</div>"
        );
      }
      function poapPaint(app, list, cacheState, generation) {
        if (generation !== poapLoadGeneration) return;
        app.innerHTML = list
          .map(function (p) {
            return (
              '<div class="project" data-to="' +
              (p.scrollTo || 0) +
              '">' +
              (list.length > 1
                ? '<div class="pname">' + esc(p.name) + "</div>"
                : "") +
              (cacheState && p.cachedAt
                ? poapCacheNotice(
                    p.cachedAt,
                    cacheState === "refreshing",
                    cacheState === "failed",
                  )
                : "") +
              p.html +
              "</div>"
            );
          })
          .join("");
        app.querySelectorAll(".project").forEach(function (pr) {
          var sc = pr.querySelector(".scroll");
          var to = Number(pr.getAttribute("data-to"));
          if (sc && to) sc.scrollLeft = Math.max(0, to - sc.clientWidth * 0.6);
        });
      }
      function start(ids) {
        var generation = ++poapLoadGeneration;
        var app = document.getElementById("app");
        if (!ids.length) {

            "No board connected",
            "Add this widget to a project board’s POAP view, or connect a project board in the widget’s settings.",
          );
          return;
        }
        var cached = ids.map(function (id) {
          var saved = poapCacheRead(id);

            ? {
                name: saved.name || "Board " + id,
                html: saved.html,
                scrollTo: saved.scrollTo,
                cachedAt: saved.savedAt,
              }
            : null;
        });
        var hasCompleteCache = cached.every(Boolean);
        if (hasCompleteCache) {
          poapPaint(app, cached, "refreshing", generation);
          console.info(
            "[POAP Programme] Displayed cached live view",
            ids.join(","),
            {
              maxAgeMinutes: Math.round(
                Math.max.apply(
                  null,
                  cached.map(function (p) {
                    return Date.now() - p.cachedAt;
                  }),
                ) / 60000,
              ),
            },
          );
        } else {
          app.innerHTML =
            '<div class="loading">Loading the marked-up programme…</div>';
        }
        // Never treat a cached report as live. Refresh in this tab on every entry.
        Promise.all(
          ids.map(function (id) {
            return loadProject(id)
              .then(function (result) {
                if (!result.cacheable) {
                  var previous = poapCacheRead(id);
                  if (previous)
                    return {
                      name: previous.name || "Board " + id,
                      html: previous.html,
                      scrollTo: previous.scrollTo,
                      cachedAt: previous.savedAt,
                      refreshFailed: true,
                    };
                  return result;
                }
                poapCacheWrite(id, result);
                return result;
              })
              .catch(function (error) {
                console.warn(
                  "[POAP Programme] Refresh failed for board",
                  id,
                  error,
                );
                var saved = poapCacheRead(id);
                return saved
                  ? {
                      name: saved.name || "Board " + id,
                      html: saved.html,
                      scrollTo: saved.scrollTo,
                      cachedAt: saved.savedAt,
                      refreshFailed: true,
                    }
                  : {
                      name: "Board " + id,
                      html: problemHtml(
                        "Couldn't load this project",
                        esc(error.message || error),
                      ),
                    };
              });
          }),
        ).then(function (list) {
          if (generation !== poapLoadGeneration) return;
          var failed = list.some(function (p) {
            return p.refreshFailed;
          });
          if (failed && hasCompleteCache) {
            poapPaint(app, cached, "failed", generation);
          } else {
            poapPaint(app, list, failed ? "failed" : null, generation);
          }
        });
      }

      getContext().then(
        function (ctx) {
          applyTheme(ctx.theme);
          poapUserScope = String(ctx.userId || (ctx.user && ctx.user.id) || "");
          var current = idsFromContext(ctx);
          start(current);
          try {
            monday.listen("context", function (res) {
              var c = (res && res.data) || {};
              if (c.theme) applyTheme(c.theme);
              var next = idsFromContext(c);
              if (next.join(",") !== current.join(",")) {
                current = next;
                start(current);
              }
            });
          } catch (e) {}
        },
        function () {
          document.getElementById("app").innerHTML = problemHtml(
            "Open this inside monday",
            "This widget shows the live marked-up programme on a project’s POAP view.",
          );
        },
      );
    </script>
  </body>
</html>
