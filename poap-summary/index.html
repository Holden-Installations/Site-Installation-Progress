  <body>
    <div class="wrap" id="app">
      <div class="loading">Loading the weekly snapshot…</div>
    </div>
    <script>
      // ---- Programme working calendar (identical code in the Programme Planner, My week and the weekly snapshot) ----
      // The project board's description carries one line, written by the planner's import (or typed by hand):
      //   Working calendar (from MS Project): Mon–Sat · non-working 21 Dec 2026 – 3 Jan 2027; 6 Apr 2027 · working 28 Dec 2026
      // With it, working days follow the programme's MS Project calendar; without it every tool counts Monday–Friday.
      const CAL_DAY = 86400000;
      const CAL_MON = [
        "jan",
        "feb",
        "mar",
        "apr",
        "may",
        "jun",
        "jul",
        "aug",
        "sep",
        "oct",
        "nov",
        "dec",
      ];
      const CAL_WD = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      function calDayNum(y, m, d) {
        return Math.round(Date.UTC(y, m, d) / CAL_DAY);
      } // whole days since 1 Jan 1970
      function calWeekday(dn) {
        return ((dn % 7) + 7 + 4) % 7;
      } // 1 Jan 1970 was a Thursday
      function calParseDate(s) {
        s = String(s || "").trim();
        let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m) return calDayNum(+m[1], +m[2] - 1, +m[3]);
        m = s.match(/^(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?\s+'?(\d{2,4})$/);
        if (!m) return null;
        const mo = CAL_MON.indexOf(m[2].toLowerCase());
        if (mo < 0) return null;
        let y = +m[3];
        if (y < 100) y += 2000;
        return calDayNum(y, mo, +m[1]);
      }
      function calParseRanges(s) {
        const out = [];
        String(s || "")
          .split(/[;,]/)
          .forEach((piece) => {
            const ends = piece.trim().split(/\s+(?:[–—-]|to)\s+/i);
            const a = calParseDate(ends[0]),
              b = ends.length > 1 ? calParseDate(ends[1]) : a;
            if (a != null && b != null)
              out.push([Math.min(a, b), Math.max(a, b)]);
          });
        return out;
      }
      function makeWorkingCalendar(days, off, on) {
        const START = calDayNum(2015, 0, 1),
          END = calDayNum(2045, 11, 31);
        const work = new Uint8Array(END - START + 1);
        for (let dn = START; dn <= END; dn++)
          work[dn - START] = days[calWeekday(dn)] ? 1 : 0;
        const mark = (ranges, v) =>
          ranges.forEach(([a, b]) => {
            for (let dn = Math.max(a, START); dn <= Math.min(b, END); dn++)
              work[dn - START] = v;
          });
        mark(off, 0);
        mark(on, 1); // extra working days win
        const cum = new Int32Array(work.length + 1);
        for (let i = 0; i < work.length; i++) cum[i + 1] = cum[i] + work[i];
        const isWork = (dn) =>
          dn < START || dn > END
            ? !!days[calWeekday(dn)]
            : work[dn - START] === 1;
        return {
          days,
          off,
          on,
          isWork,
          count(a, b) {
            // working days from a to b, both included
            if (b < a) return 0;
            if (a >= START && b <= END)
              return cum[b - START + 1] - cum[a - START];
            let n = 0;
            for (let dn = a; dn <= b; dn++) if (isWork(dn)) n++;
            return n;
          },
        };
      }
      function parseWorkingCalendar(text) {
        const lines = String(text || "").split(/\r?\n/);
        const at = lines.findIndex((l) =>
          /working calendar\s*\(from ms project\)\s*:/i.test(l),
        );
        if (at < 0) return null;
        // the line may have been broken by hand: follow it while it clearly continues
        let body = lines[at].replace(
          /^.*?working calendar\s*\(from ms project\)\s*:\s*/i,
          "",
        );
        for (let k = at + 1; k < lines.length; k++) {
          const next = lines[k].trim();
          if (!next) break;
          if (
            /[-–—·•|;,]\s*$/.test(body) ||
            /^(non|working|\d|[·•|;,])/i.test(next)
          )
            body += " " + next;
          else break;
        }
        const parts = body.split(/\s*[·•|]\s*/);
        const DAYS = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
        const days = [false, false, false, false, false, false, false];
        const dp = (parts.shift() || "").toLowerCase();
        const rng = dp.match(
          /^(sun|mon|tue|wed|thu|fri|sat)[a-z]*\s*[–—-]\s*(sun|mon|tue|wed|thu|fri|sat)/,
        );
        if (rng) {
          for (let i = DAYS[rng[1]], g = 0; g < 7; i = (i + 1) % 7, g++) {
            days[i] = true;
            if (i === DAYS[rng[2]]) break;
          }
        } else
          (dp.match(/sun|mon|tue|wed|thu|fri|sat/g) || []).forEach((k) => {
            days[DAYS[k]] = true;
          });
        if (!days.some(Boolean)) return null;
        const off = [],
          on = [];
        parts.forEach((p) => {
          const mm = p.match(/^(non[\s-]*working|working)\s+(.*)$/i);
          if (!mm) return;
          (/^non/i.test(mm[1]) ? off : on).push(...calParseRanges(mm[2]));
        });
        return makeWorkingCalendar(days, off, on);
      }
      function calFmtDate(dn) {
        const d = new Date(dn * CAL_DAY);
        return (
          d.getUTCDate() +
          " " +
          CAL_MON[d.getUTCMonth()][0].toUpperCase() +
          CAL_MON[d.getUTCMonth()].slice(1) +
          " " +
          d.getUTCFullYear()
        );
      }
      function formatWorkingCalendar(days, off, on) {
        const order = [1, 2, 3, 4, 5, 6, 0],
          idx = order.filter((i) => days[i]);
        const first = order.indexOf(idx[0]),
          last = order.indexOf(idx[idx.length - 1]);
        const contiguous = idx.length > 1 && last - first + 1 === idx.length;
        const dayText = contiguous
          ? `${CAL_WD[idx[0]]}–${CAL_WD[idx[idx.length - 1]]}`
          : idx.map((i) => CAL_WD[i]).join(", ");
        const merge = (rs) =>
          rs
            .slice()
            .sort((a, b) => a[0] - b[0])
            .reduce((acc, r) => {
              const l = acc[acc.length - 1];
              if (l && r[0] <= l[1] + 1) l[1] = Math.max(l[1], r[1]);
              else acc.push(r.slice());
              return acc;
            }, []);
        const fmt = (rs) =>
          merge(rs)
            .map(([a, b]) =>
              a === b ? calFmtDate(a) : `${calFmtDate(a)} – ${calFmtDate(b)}`,
            )
            .join("; ");
        let line = `Working calendar (from MS Project): ${dayText}`;
        if (off.length) line += ` · non-working ${fmt(off)}`;
        if (on.length) line += ` · working ${fmt(on)}`;
        return line;
      }
      // ---- end of shared calendar code ----

      // ---- Shared by the POAP widgets (Site installation summary + Marked-up programme) ----
      var HISTORY = {
        boardId: "5106398376", // Programme Progress history board
        cols: {
          // matched by id first, then by name
          projectBoardId: { id: "text_mm8a8vpx", title: "project board id" },
          weekEnding: { id: "date_mm8av3kd", title: "week ending" },
          snapshotTaken: { id: "date_mm8aq588", title: "snapshot taken" },
          planned: { id: "numeric_mm8aya41", title: "planned %" },
          actual: { id: "numeric_mm8av2aw", title: "actual %" },
          worstDelay: { id: "numeric_mm8a4dkt", title: "worst delay (days)" },
          tasksBehind: { id: "numeric_mm8as8my", title: "tasks behind" },
          tasksTracked: { id: "numeric_mm8av68a", title: "tasks tracked" },
          measuredAgainst: { id: "text_mm8ab0k3", title: "measured against" },
        },
        scheduleDay: 0,
        scheduleHour: 6, // the n8n job runs Sunday 06:00
      };
      var PROJECT_COLS = {
        snapshot: { id: "numeric_mm8ay8nf", title: "snapshot actual %" },
        timeline: { id: "", title: "timeline" },
        index: { id: "", title: "index" },
        // Latest Baseline: filled by the planner's import. monday's "Baseline of Timeline (…)" columns are no longer used.
        baseline: {
          id: "5103953529__timerange_mm8b45mv",
          title: "latest baseline",
        },
      };
      // tracked tasks: the lowest rows (nothing under them) with an Install / Installation / Installations row anywhere above
      var TRACKED_PARENT = /^install(ation)?s?$/;
      function installChain(it, byId, hasKids) {
        // the rows above a tracked task, nearest first; null if it isn't one
        if (hasKids[it.id]) return null;
        var chain = [],
          cur = it.parent_item && byId[it.parent_item.id],
          g = 0;
        while (cur && g++ < 12) {
          chain.push(cur);
          cur = cur.parent_item && byId[cur.parent_item.id];
        }
        var top = -1;
        chain.forEach(function (a, k) {
          if (TRACKED_PARENT.test(norm(a.name))) top = k;
        });
        return top < 0 ? null : { chain: chain, top: top };
      }

      var monday = window.mondaySdk();
      function norm(s) {
        return String(s || "")
          .toLowerCase()
          .replace(/\s+/g, " ")
          .trim();
      }
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          }[c];
        });
      }
      function api(query, variables) {
        return monday
          .api(query, { variables: variables || {} })
          .then(function (res) {
            if (!res) throw new Error("monday sent back an empty reply.");
            if (res.errors && res.errors.length)
              throw new Error(
                res.errors
                  .map(function (e) {
                    return e.message;
                  })
                  .join("; "),
              );
            if (res.error_message) throw new Error(res.error_message);
            return res.data;
          });
      }
      function applyTheme(t) {
        document.documentElement.setAttribute(
          "data-theme",
          t === "dark" || t === "black" ? t : "light",
        );
      }
      function idsFromContext(ctx) {
        var ids =
          ctx.boardIds && ctx.boardIds.length
            ? ctx.boardIds
            : ctx.boardId
              ? [ctx.boardId]
              : [];
        return ids.map(String).filter(function (v, i, a) {
          return v && a.indexOf(v) === i;
        });
      }
      function getContext() {
        return new Promise(function (resolve, reject) {
          var done = false,
            tries = 0;
          function attempt() {
            if (done) return;
            tries++;
            monday.get("context").then(
              function (r) {
                var c = r && r.data;
                if (
                  !done &&
                  c &&
                  (c.instanceType ||
                    c.boardId ||
                    (c.boardIds && c.boardIds.length))
                ) {
                  done = true;
                  clearInterval(timer);
                  resolve(c);
                }
              },
              function () {},
            );
          }
          var timer = setInterval(function () {
            if (tries >= 10) {
              clearInterval(timer);
              if (!done) {
                done = true;
                reject(new Error("NO_MONDAY"));
              }
              return;
            }
            attempt();
          }, 2000);
          attempt();
        });
      }
      // ---- dates as whole days (UTC day numbers) ----
      function dnOf(iso) {
        if (!iso) return null;
        var p = String(iso).slice(0, 10).split("-").map(Number);
        return p.length === 3 && p[0] ? calDayNum(p[0], p[1] - 1, p[2]) : null;
      }
      function dnToday() {
        if (window.TEST_TODAY) return dnOf(window.TEST_TODAY);
        var n = new Date();
        return calDayNum(n.getFullYear(), n.getMonth(), n.getDate());
      }
      function fmtDn(dn, withDay) {
        var d = new Date(dn * CAL_DAY);
        return (
          (withDay === false ? "" : CAL_WD[d.getUTCDay()] + " ") +
          d.getUTCDate() +
          " " +
          CAL_MON[d.getUTCMonth()][0].toUpperCase() +
          CAL_MON[d.getUTCMonth()].slice(1, 3)
        );
      }
      function fmtWhen(dt) {
        return (
          dt.toLocaleDateString("en-GB", {
            weekday: "short",
            day: "numeric",
            month: "short",
          }) +
          " " +
          dt.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" })
        );
      }
      function nextSnapshot() {
        var now = new Date(),
          d = new Date(now);
        d.setDate(d.getDate() + ((HISTORY.scheduleDay - d.getDay() + 7) % 7));
        d.setHours(HISTORY.scheduleHour, 0, 0, 0);
        if (d <= now) d.setDate(d.getDate() + 7);
        return d;
      }
      function makeIsWork(cal) {
        return function (dn) {
          if (cal) return cal.isWork(dn);
          var w = calWeekday(dn);
          return w >= 1 && w <= 5;
        };
      }
      function makeCount(cal) {
        return function (a, b) {
          if (b < a) return 0;
          if (cal) return cal.count(a, b);
          var n = 0;
          for (var d = a; d <= b; d++) {
            var w = calWeekday(d);
            if (w >= 1 && w <= 5) n++;
          }
          return n;
        };
      }
      // the day a snapshot measures: the last working day on or before it was taken, never after its week ending
      function snapshotStatusDn(row, isWork) {
        var d = row.weekEndingDn;
        if (row.snapshotTaken) {
          var t = row.snapshotTaken;
          var td = calDayNum(t.getFullYear(), t.getMonth(), t.getDate());
          if (td < d) d = td;
        }
        var guard = 0;
        while (!isWork(d) && guard++ < 60) d--;
        return d;
      }
      // ---- the project board: name, calendar line, columns ----
      function readBoard(boardId) {
        return api(
          "query ($b: [ID!]) { boards(ids: $b, hierarchy_types: [classic, multi_level]) { id name description columns { id title type } } }",
          { b: [boardId] },
        )
          .catch(function () {
            return api(
              "query ($b: [ID!]) { boards(ids: $b) { id name description columns { id title type } } }",
              { b: [boardId] },
            );
          })
          .then(function (d) {
            var b = d && d.boards && d.boards[0];
            if (!b) throw new Error("This board could not be read.");
            var find = function (spec) {
              return (
                (spec.id &&
                  b.columns.filter(function (c) {
                    return c.id === spec.id;
                  })[0]) ||
                b.columns.filter(function (c) {
                  return norm(c.title) === spec.title;
                })[0] ||
                null
              );
            };
            return {
              id: String(b.id),
              name: b.name,
              cal: parseWorkingCalendar(b.description),
              cols: {
                actual:
                  [
                    "Actual %",
                    "Progress %",
                    "% Complete",
                    "Percentage Complete",
                  ]
                    .map(function (title) {
                      return b.columns.find(function (c) {
                        return norm(c.title) === norm(title);
                      });
                    })
                    .find(Boolean) || null,
                timeline: find(PROJECT_COLS.timeline),
                index: find(PROJECT_COLS.index),
                baseline: find(PROJECT_COLS.baseline),
              },
            };
          });
      }
      // ---- this board's rows on the Progress history board (oldest first) ----
      function readHistory(boardId) {
        return api(
          "query ($ids: [ID!]) { boards(ids: $ids) { columns { id title } } }",
          { ids: [HISTORY.boardId] },
        ).then(function (meta) {
          var cols =
            meta && meta.boards && meta.boards[0]
              ? meta.boards[0].columns
              : null;
          if (!cols)
            throw new Error("the Progress history board isn't visible to you");
          var C = {};
          Object.keys(HISTORY.cols).forEach(function (k) {
            var spec = HISTORY.cols[k];
            var c =
              cols.filter(function (x) {
                return x.id === spec.id;
              })[0] ||
              cols.filter(function (x) {
                return norm(x.title) === spec.title;
              })[0];
            if (c) C[k] = c.id;
          });
          if (!C.projectBoardId || !C.weekEnding)
            throw new Error("the Progress history board is missing columns");
          var ids = Object.keys(C).map(function (k) {
            return C[k];
          });
          return api(
            "query { items_page_by_column_values(board_id: " +
              JSON.stringify(HISTORY.boardId) +
              ", limit: 300, columns: [{ column_id: " +
              JSON.stringify(C.projectBoardId) +
              ", column_values: [" +
              JSON.stringify(String(boardId)) +
              "] }]) { items { id column_values(ids: " +
              JSON.stringify(ids) +
              ") { id text value } } } }",
          ).then(function (data) {
            var items =
              (data &&
                data.items_page_by_column_values &&
                data.items_page_by_column_values.items) ||
              [];
            var get = function (it, k) {
              return (

              .map(function (it) {

                  tasksBehind: num(it, "tasksBehind"),

                  measuredAgainst: C.measuredAgainst

              .filter(function (r) {

        });
      }
      function snapshotLine(row, statusDn) {

          statusDn !== row.weekEndingDn
            ? " (as of " + fmtDn(statusDn) + ")"
            : "";

          "Weekly snapshot · w/e " +
          fmtDn(row.weekEndingDn) +
          asOf +
          (row.snapshotTaken
            ? " · updated " + fmtWhen(row.snapshotTaken)
            : "") +
          " · next update " +
          fmtWhen(nextSnapshot())

      }
      function problemHtml(title, body) {
        return (
          '<div class="problem"><p class="h">' +
          esc(title) +
          '</p><p class="s">' +
          body +
          "</p></div>"
        );
      }

      function cardsHtml(row) {
        var behind =
          row.actual != null && row.planned != null && row.actual < row.planned;
        var late = row.worstDelay != null && row.worstDelay > 0.05;
        var nBehind = row.tasksBehind || 0;

          '<div class="cards">' +
          '<div class="card"><div class="big">' +
          (row.planned == null ? "–" : row.planned + "%") +
          '</div><div class="lbl"><span class="dash"></span>Planned</div></div>' +
          '<div class="card"><div class="row"><div class="big ' +
          (behind ? "behind" : "good") +
          '">' +
          (row.actual == null ? "–" : row.actual + "%") +
          "</div>" +
          '<div class="mini"><div class="mini-fill ' +
          (behind ? "behind" : "") +
          '" style="width:' +
          Math.max(0, Math.min(100, row.actual || 0)) +
          '%"></div><div class="mini-mark" style="left:' +
          Math.max(0, Math.min(100, row.planned || 0)) +
          '%"></div></div></div>' +
          '<div class="lbl"><span class="solid ' +
          (behind ? "behind" : "") +
          '"></span>Actual</div></div>' +

          "</div></div>" +
          '<div class="card"><div class="big ' +
          (nBehind ? "bad" : "good") +

      // ---- shared with the POAP Marked-up programme widget (copied verbatim) ----
      function areaOf(name) {
        var s = String(name || "");
        var i = s.search(/[-–—]/);
        return (i > 0 ? s.slice(0, i) : s).trim();
      }
      function natural(a, b) {
        return String(a).localeCompare(String(b), undefined, {
          numeric: true,
          sensitivity: "base",
        });
      }

      // Two-stage retrieval: paginate lightweight item IDs in board order, then
      // retrieve only the four required columns via independent 100-item batches.
      // Unlike cursor pages, ID batches can run concurrently. On any mismatch
      // or API incompatibility we fall back to the original full-page query.
      function readItems(boardId, colIds) {
        var PAGE_SIZE = 500;
        var BATCH_SIZE = 100; // monday's documented items(ids:) maximum
        var WORKERS = 8;
        var timings = {
          strategy: "parallel-details",
          pageCount: 0,
          batchCount: 0,
        };
        var started = performance.now();
        var minimal = "id name parent_item { id }";
        var full = function (cap) {
          return (
            minimal +
            " column_values(ids: $c" +
            (cap ? ", capabilities: [CALCULATED]" : "") +
            ") { id text value ... on NumbersValue { number } ... on TimelineValue { from to } }"
          );
        };
        function pageFirst(fields, cap) {
          // The lightweight discovery query does not use $c. GraphQL rejects
          // queries declaring unused variables, so include it only for detail pages.
          var usesColumns = fields.indexOf("column_values(") !== -1;
          return api(
            "query ($b: [ID!]" +
              (usesColumns ? ", $c: [String!]" : "") +
              ") { boards(ids: $b) { items_page(limit: " +
              PAGE_SIZE +
              ', hierarchy_scope_config: "allItems") { cursor items { ' +
              fields +
              " } } } }",
            usesColumns ? { b: [boardId], c: colIds } : { b: [boardId] },
          ).then(function (d) {
            if (!d || !d.boards || !d.boards[0] || !d.boards[0].items_page)
              throw new Error("Missing first items page");
            return d.boards[0].items_page;
          });
        }
        function pageNext(cursor, fields) {
          var usesColumns = fields.indexOf("column_values(") !== -1;
          return api(
            "query ($cur: String!" +
              (usesColumns ? ", $c: [String!]" : "") +
              ") { next_items_page(limit: " +
              PAGE_SIZE +
              ", cursor: $cur) { cursor items { " +
              fields +
              " } } }",
            usesColumns ? { cur: cursor, c: colIds } : { cur: cursor },
          ).then(function (d) {
            if (!d || !d.next_items_page)
              throw new Error("Missing next items page");
            return d.next_items_page;
          });
        }
        function enumerate(fields) {
          var rows = [];
          var seenCursors = new Set();
          function accept(page) {
            timings.pageCount++;
            if (!page || !Array.isArray(page.items))
              throw new Error("Invalid item page");
            for (var i = 0; i < page.items.length; i++)
              rows.push(page.items[i]);
            if (!page.cursor) return Promise.resolve(rows);
            if (seenCursors.has(page.cursor))
              throw new Error("Repeated items cursor");
            seenCursors.add(page.cursor);
            return pageNext(page.cursor, fields).then(accept);
          }
          return pageFirst(fields).then(accept);
        }
        function detailBatch(ids, cap) {
          return api(
            "query ($ids: [ID!], $c: [String!]) { items(ids: $ids, limit: 100) { " +
              full(cap) +
              " } }",
            { ids: ids, c: colIds },
          ).then(function (d) {
            if (!d || !Array.isArray(d.items))
              throw new Error("Missing detail items");
            return d.items;
          });
        }
        function readDetails(rows, cap) {
          var batches = [];
          for (var i = 0; i < rows.length; i += BATCH_SIZE)
            batches.push(
              rows.slice(i, i + BATCH_SIZE).map(function (it) {
                return it.id;
              }),
            );
          timings.batchCount = batches.length;
          var results = new Array(batches.length);
          var next = 0;
          var firstError = null;
          function worker() {
            if (firstError || next >= batches.length) return Promise.resolve();
            var index = next++;
            return detailBatch(batches[index], cap).then(
              function (items) {
                results[index] = items;
                return worker();
              },
              function (error) {
                // Drain in-flight requests before retrying or falling back.
                if (!firstError) firstError = error;
              },
            );
          }
          var workers = [];
          for (var j = 0; j < Math.min(WORKERS, batches.length); j++)
            workers.push(worker());
          return Promise.all(workers).then(function () {
            if (firstError) throw firstError;
            var byId = new Map();
            results.forEach(function (batch) {
              batch.forEach(function (it) {
                if (!it || it.id == null || byId.has(String(it.id)))
                  throw new Error("Duplicate or invalid detail item");
                byId.set(String(it.id), it);
              });
            });
            if (byId.size !== rows.length)
              throw new Error("Detail item count mismatch");
            return rows.map(function (base) {
              var it = byId.get(String(base.id));
              if (!it || !Array.isArray(it.column_values))
                throw new Error("Missing detail values for item " + base.id);
              // Preserve the exact original paginated ordering and parent links.
              if (String(it.id) !== String(base.id))
                throw new Error("ID mismatch");
              return {
                id: base.id,
                name: base.name,
                parent_item: base.parent_item,
                column_values: it.column_values,
              };
            });
          });
        }
        function fallback(reason) {
          console.warn(
            "[POAP Summary] Parallel retrieval unavailable; using original pagination:",
            reason,
          );
          timings.strategy = "original-fallback";
          timings.pageCount = 0;
          timings.batchCount = 0;
          function fullScan(cap) {
            return enumerate(full(cap));
          }
          return fullScan(true).catch(function () {
            timings.pageCount = 0;
            return fullScan(false);
          });
        }
        return enumerate(minimal)
          .then(function (rows) {
            timings.discoveryMs = Math.round(performance.now() - started);
            if (
              new Set(
                rows.map(function (r) {
                  return String(r.id);
                }),
              ).size !== rows.length
            )
              throw new Error("Duplicate item IDs in pagination");
            var detailStart = performance.now();
            return readDetails(rows, true)
              .catch(function (err) {
                // Some board/API configurations do not support calculated capabilities.
                timings.batchCount = 0;
                console.warn(
                  "[POAP Summary] Retrying item details without calculated capability:",
                  err,
                );
                return readDetails(rows, false);
              })
              .then(function (items) {
                timings.detailsMs = Math.round(performance.now() - detailStart);
                return items;
              });
          })
          .catch(fallback)
          .then(function (items) {
            timings.itemCount = items.length;
            timings.totalMs = Math.round(performance.now() - started);
            console.info("[POAP Summary] Retrieval metrics", boardId, timings);
            return items;
          });
      }
      function cvOf(it, colId) {
        return colId
          ? (it.column_values || []).filter(function (v) {
              return v.id === colId;
            })[0] || null
          : null;
      }
      function numOf(v) {
        if (!v) return null;
        if (typeof v.number === "number") return v.number;
        var n = parseFloat(v.text);
        return isNaN(n) ? null : n;
      }
      function datesOf(v) {
        if (!v) return null;
        var f = v.from,
          t = v.to;
        if (!f || !t) {
          try {
            var j = JSON.parse(v.value || "null");
            if (j) {
              f = j.from;
              t = j.to;
            }
          } catch (e) {}
        }
        var a = dnOf(f),
          b = dnOf(t);
        return a != null && b != null ? [a, b] : null;
      }

      // Package rows: same task rules as the Marked-up programme widget, rolled up to the top-level item.
      function buildPackages(board, items, today) {
        var count = makeCount(board.cal);
        var byId = {},
          hasKids = {};
        items.forEach(function (it) {
          byId[it.id] = it;
          if (it.parent_item) hasKids[it.parent_item.id] = 1;
        });
        var top = function (it) {
          var cur = it,
            g = 0;
          while (cur.parent_item && byId[cur.parent_item.id] && g++ < 10)
            cur = byId[cur.parent_item.id];
          return cur;
        };
        var C = board.cols,
          pkgs = {},
          order = [],
          all = [];
        items.forEach(function (it) {
          if (!installChain(it, byId, hasKids)) return;
          var tl = datesOf(cvOf(it, C.timeline && C.timeline.id)),
            bl = datesOf(cvOf(it, C.baseline && C.baseline.id));
          var plan = bl || tl;
          if (!plan) return;
          var s = plan[0],
            f = plan[1],
            D = Math.max(count(s, f), 1);
          var actual = Math.max(
            0,
            Math.min(100, numOf(cvOf(it, C.actual && C.actual.id)) || 0),
          );
          var elapsed = today >= s ? count(s, today) : -count(today + 1, s - 1);
          var planned =
            today < s
              ? 0
              : today > f
                ? 100
                : Math.round((Math.min(elapsed, D) / D) * 100);
          var daysLate = Math.round((elapsed - (actual / 100) * D) * 10) / 10;
          var kind =
            actual >= 100
              ? "done"
              : planned === 0 && actual === 0
                ? "notstarted"
                : daysLate > 0.05
                  ? "behind"
                  : "ontrack";
          var t = {
            D: D,
            planned: planned,
            actual: actual,
            daysLate: daysLate,
            kind: kind,
          };
          var pk = top(it);
          if (!pkgs[pk.id]) {
            pkgs[pk.id] = {
              id: pk.id,
              name: pk.name,
              idx: numOf(cvOf(pk, C.index && C.index.id)),
              tasks: [],
            };
            order.push(pk.id);
          }
          pkgs[pk.id].tasks.push(t);
          all.push(t);
        });
        var seq = {};
        items.forEach(function (it, k) {
          seq[it.id] = k;
        });
        var byIdx = function (a, b) {
          return (
            (a.idx == null ? Infinity : a.idx) -
              (b.idx == null ? Infinity : b.idx) || seq[a.id] - seq[b.id]
          );
        };
        var list = order
          .map(function (k) {
            return pkgs[k];
          })
          .sort(function (a, b) {
            return natural(areaOf(a.name), areaOf(b.name)) || byIdx(a, b);
          });
        var total = all.length ? rollUp(all) : null;

        var behindTasks = all.filter(function (t) {
          return (
            t.kind !== "done" && t.kind !== "notstarted" && t.daysLate > 0.05
          );
        });

        var worstDelay = behindTasks.length
          ? Math.max.apply(
              null,
              behindTasks.map(function (t) {
                return t.daysLate;
              }),
            )
          : 0;

        return {
          pkgs: list.map(function (P) {
            return {
              name: P.name,
              a: rollUp(P.tasks),
            };
          }),
          total: total,
          summary: {
            planned: total ? total.planned : null,
            actual: total ? total.actual : null,
            worstDelay: worstDelay,
            tasksBehind: behindTasks.length,
            tasksTracked: all.length,
          },
        };
      }
      // duration-weighted %, worst open task for days late (same as poap-programme's agg)
      function rollUp(tasks) {
        var den = 0,
          pl = 0,
          ac = 0,
          worst = null,
          allDone = true;
        tasks.forEach(function (t) {
          den += t.D;
          pl += t.planned * t.D;
          ac += t.actual * t.D;
          if (t.kind !== "done") allDone = false;
          if (t.kind !== "done" && t.kind !== "notstarted")
            worst = worst == null ? t.daysLate : Math.max(worst, t.daysLate);
        });
        return {
          planned: Math.round(pl / den),
          actual: Math.round(ac / den),
          worst: worst,
          allDone: allDone,
        };
      }
      function chipHtml(a) {
        if (a.allDone) return '<span class="chip good">✓&nbsp;Done</span>';
        if (a.worst == null)
          return '<span class="chip grey">Not started</span>';
        if (a.worst > 0.05)
          return (
            '<span class="chip bad">⚠&nbsp;' +
            a.worst.toFixed(1) +
            " days late</span>"
          );
        if (a.worst < -0.05)
          return (
            '<span class="chip good">↑&nbsp;' +
            (-a.worst).toFixed(1) +
            " days ahead</span>"
          );
        return '<span class="chip good">↑&nbsp;On plan</span>';
      }
      function pkgRowHtml(name, a, cls) {
        var behind = !a.allDone && a.worst != null && a.worst > 0.05;
        var p = Math.max(0, Math.min(100, a.planned)),
          x = Math.max(0, Math.min(100, a.actual));
        var bar =
          '<div class="bar"><div class="hatch" style="width:' +
          p +
          '%"></div>' +
          (x > 0
            ? '<div class="fill' +
              (behind ? " behind" : "") +
              '" style="width:' +
              x +
              '%"></div>'
            : "") +
          '<div class="tick" style="left:' +
          p +
          '%"></div></div>';
        return (
          '<div class="' +
          (cls || "") +
          '" style="display:contents">' +
          '<div class="pk-name" title="' +
          esc(name) +
          '">' +
          esc(name) +
          "</div>" +
          '<div class="pk-num">' +
          a.planned +
          "%</div>" +
          '<div class="pk-num pk-act ' +
          (behind ? "behind" : a.actual > 0 || a.allDone ? "good" : "") +
          '">' +
          a.actual +
          "%</div>" +
          '<div class="pk-st">' +
          chipHtml(a) +
          "</div>" +
          '<div class="pk-barcell">' +
          bar +
          '</div><div class="pk-sep"></div></div>'
        );
      }
      function packagesHtml(model) {
        if (!model.pkgs.length)
          return problemHtml(
            "No installation tasks yet",
            "Tasks under an Install or Installations row appear here.",
          );
        var hatch =
          "background:repeating-linear-gradient(135deg,var(--ui-border) 0 2px,transparent 2px 5px)";
        return (
          '<div class="pk-grid">' +
          '<div class="pk-th">Package</div><div class="pk-th num">Planned</div><div class="pk-th num">Actual</div><div class="pk-th st">Status</div><div class="pk-sep"></div>' +
          model.pkgs
            .map(function (P) {
              return pkgRowHtml(P.name, P.a);
            })
            .join("") +
          pkgRowHtml("All packages", model.total, "pk-total") +
          "</div>" +
          '<div class="legend"><span><i class="lg" style="' +
          hatch +
          '"><i style="position:absolute;right:2px;top:-3px;width:2px;height:14px;background:var(--text)"></i></i>Planned</span>' +
          '<span><i class="lg" style="background:var(--primary)"></i>Actual, behind</span><span><i class="lg" style="background:var(--label-done)"></i>Actual, on track</span></div>'
        );
      }

      function loadProject(boardId) {
        return readBoard(boardId).then(function (b) {
          var head =
            '<div class="si-head">' +
            '<div class="si-title">Site installation</div>' +
            '<div class="si-proj">' +
            esc(b.name) +
            " · Live programme</div></div>";

          if (!b.cols.actual || !b.cols.timeline) {
            return {
              name: b.name,
              html:
                head +
                problemHtml(
                  "Live progress unavailable",
                  "The project board requires a Timeline and a live progress percentage column.",
                ),
            };
          }

          var ids = [
            b.cols.timeline.id,
            b.cols.actual.id,
            b.cols.baseline && b.cols.baseline.id,
            b.cols.index && b.cols.index.id,
          ].filter(Boolean);

          return readItems(boardId, ids).then(function (items) {
            var today = dnToday();
            var model = buildPackages(b, items, today);

            return {
              name: b.name,
              html:
                head +
                (model.total ? cardsHtml(model.summary) : "") +
                packagesHtml(model) +
                '<div class="info">Live programme · as of ' +
                esc(fmtWhen(new Date())) +
                "</div>",
            };
          });
        });
      }

      // Cached-first rendering, scoped to this user and board. Cached data is
      // clearly marked, and a fresh monday.com read is attempted on every entry.
      var SUMMARY_CACHE_VERSION = "poap-summary-v8-instant-1";
      var SUMMARY_CACHE_TTL = 24 * 60 * 60 * 1000;
      var summaryUserScope = "";
      var summaryGeneration = 0;
      function summaryCacheKey(id) {
        return (
          SUMMARY_CACHE_VERSION + ":" + summaryUserScope + ":" + String(id)
        );
      }
      function summaryCached(id) {
        if (!summaryUserScope) return null;
        try {
          var saved = JSON.parse(
            localStorage.getItem(summaryCacheKey(id)) || "null",
          );
          if (
            !saved ||
            typeof saved.html !== "string" ||
            !Number.isFinite(saved.savedAt) ||
            Date.now() < saved.savedAt ||
            Date.now() - saved.savedAt > SUMMARY_CACHE_TTL
          )
            return null;
          return saved;
        } catch (e) {
          return null;
        }
      }
      function summarySave(id, project) {
        if (
          !summaryUserScope ||
          !project ||
          !project.cacheable ||
          !project.html
        )
          return;
        try {
          localStorage.setItem(
            summaryCacheKey(id),
            JSON.stringify({
              name: project.name,
              html: project.html,
              savedAt: Date.now(),
            }),
          );
        } catch (e) {
          console.warn("[POAP Summary] Cache write unavailable", e.message);
        }
      }
      function summaryNotice(time, failure) {
        var label = failure
          ? "Cached weekly snapshot · refresh failed"
          : "Cached weekly snapshot · refreshing";
        return (
          '<div role="status" class="info" style="border:1px solid var(--border);border-radius:6px;background:var(--page);padding:6px 9px">' +
          esc(label) +
          " · saved " +
          esc(new Date(time).toLocaleString("en-GB")) +
          "</div>"
        );
      }
      function summaryPaint(app, list, generation) {
        if (generation !== summaryGeneration) return;
        app.innerHTML = list
          .map(function (p) {
            return (
              '<div class="project">' +
              (p.cachedAt ? summaryNotice(p.cachedAt, !!p.refreshFailed) : "") +
              p.html +
              "</div>"
            );
          })
          .join("");
      }

      function start(ids) {
        var generation = ++summaryGeneration;
        var app = document.getElementById("app");

        if (!ids.length) {
          app.innerHTML = problemHtml(
            "No board connected",
            "Connect a project programme board.",
          );
          return;
        }

        app.innerHTML =
          '<div class="loading">Loading live installation progress…</div>';

        var started = performance.now();

        Promise.all(
          ids.map(function (id) {
            return loadProject(id).catch(function (e) {
              console.error("[Site Installation] Load failed", id, e);

              return {
                name: "Board " + id,
                html: problemHtml(
                  "Could not load live progress",
                  esc(e.message || e),
                ),
              };
            });
          }),
        ).then(function (projects) {
          if (generation !== summaryGeneration) return;

          app.innerHTML = projects
            .map(function (p) {
              return '<div class="project">' + p.html + "</div>";
            })
            .join("");

          console.info("[Site Installation] Live load", {
            boardIds: ids,
            totalMs: Math.round(performance.now() - started),
            projectCount: projects.length,
          });
        });
      }

      getContext().then(
        function (ctx) {
          applyTheme(ctx.theme);
          summaryUserScope = String(
            ctx.userId || (ctx.user && ctx.user.id) || "",
          );
          var current = idsFromContext(ctx);
          start(current);
          try {
            monday.listen("context", function (res) {
              var c = (res && res.data) || {};
              if (c.theme) applyTheme(c.theme);
              var next = idsFromContext(c);
              if (next.join(",") !== current.join(",")) {
                current = next;
                start(current);
              }
            });
          } catch (e) {}
        },
        function () {
          document.getElementById("app").innerHTML = problemHtml(
            "Open this inside monday",
            "This widget shows the weekly site installation snapshot on a project’s POAP view.",
          );
        },
      );
    </script>
  </body>
</html>
